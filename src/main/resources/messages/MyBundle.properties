title.settings = Settings

settings.general.group.title=GitLink
settings.general.field.platform.label=Platform
settings.general.field.platform.help=Determines the format of the URLs GitLink generates. Both cloud-hosted and \
  self-hosted deployments are supported.
settings.general.field.fallback-branch.label=Fallback branch
settings.general.field.fallback-branch.help=Used in place of the current branch when nothing is checked out, or when \
  the current branch has not been pushed to the remote.
settings.general.field.remote.label=Remote
settings.general.field.remote.help=The Git remote to build links from. Its URL forms the base of every link GitLink generates.
settings.general.section.advanced.label=Advanced
settings.general.field.force-https.label=Force HTTPS
settings.general.field.force-https.help=Generates https:// links even when the remote is configured over SSH.
settings.general.field.check-remote.label=Check remote
settings.general.field.check-remote.help=Checks that the current branch or commit exists on the remote before linking \
  to it, falling back to something that does rather than generating a link that 404s. The check contacts the remote, \
  so it can be slow on large repositories.

